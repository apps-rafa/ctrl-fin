# A cada push no main que muda o app, carimba o ?v= dos CSS/JS no index.html (data/hora), para o navegador pegar a versão nova sem cache velho.
# O commit do robô só muda o index.html, então não dispara este workflow de novo (paths-ignore) nem os outros ([skip ci]).
name: Carimbar versão
on:
  push:
    branches: [main]
    paths-ignore: ["index.html", "supabase/**", "tests/**", ".github/**", "scripts/**"]
permissions:
  contents: write
concurrency:
  group: carimbar-versao
  cancel-in-progress: false
jobs:
  carimbar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/carimbar-versao.mjs
      - name: Commit (se mudou)
        run: |
          if git diff --quiet index.html; then echo "sem mudança"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Carimba versão dos arquivos [skip ci]"
          git pull --rebase origin main
          git push origin main
