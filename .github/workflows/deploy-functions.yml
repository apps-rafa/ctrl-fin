# Publica as Edge Functions do Supabase quando algo em supabase/functions muda no main.
# Precisa do segredo SUPABASE_ACCESS_TOKEN (Supabase > Account > Access Tokens) em
# Settings > Secrets and variables > Actions do repositório.
name: Deploy das Edge Functions
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:
env:
  PROJECT_REF: hhmuqgkabknquvhxafmf
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy (só roda se o segredo SUPABASE_ACCESS_TOKEN existir)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Sem SUPABASE_ACCESS_TOKEN: deploy pulado."; exit 0; fi
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            case "$fn" in _*) continue ;; esac # _shared não é uma função
            # Os webhooks (Telegram/Pluggy) não recebem JWT do Supabase: têm segredo próprio
            case "$fn" in
              telegram-webhook|pluggy-webhook|enviar-backup) flag="--no-verify-jwt" ;; # enviar-backup confere o JWT do usuário (botão) ou o segredo do cron dentro da função
              *) flag="" ;;
            esac
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api $flag
          done
